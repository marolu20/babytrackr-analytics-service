spring:
  config:
    import: "optional:file:.env[.properties]" # loads the .env file
  application:
    name: babytrackr-analytics-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_MAIN_USERNAME}
    password: ${DB_MAIN_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

server:
  port: 8081

babytrackr:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    topics:
      baby-events: baby-events
